# Escuta+ no Fly.io — região São Paulo (dados no Brasil).
app = "escuta-mais"
primary_region = "gru"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ESCUTA_AMBIENTE = "producao"
  ESCUTA_DATABASE_URL = "sqlite:////data/escuta.db"
  ESCUTA_DIR_ANEXOS = "/data/anexos"
  ESCUTA_CONFIAR_PROXY = "1"
  ESCUTA_UF_PADRAO = "MG"
  # Segredos via `fly secrets set` (nunca aqui): ESCUTA_CHAVE_CIFRA, ESCUTA_CHAVES_ACESSO,
  # ESCUTA_SEGREDO_PROXY e, se usar IA, ANTHROPIC_API_KEY.

[[mounts]]
  source = "escuta_dados"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite em volume: exatamente UMA máquina, sempre ligada (fila P1 sem cold start).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/saude"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
