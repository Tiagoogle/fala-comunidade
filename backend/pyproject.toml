[project]
name = "escuta-mais"
version = "0.1.0"
description = "Escuta+ — agente de IA para relacionamento comunitário com supervisão humana permanente (MVP seguro, spec v1.0 §18.5)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "anthropic>=2.0",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["escuta*"]

[tool.setuptools.package-data]
escuta = ["prompts/*.md", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
