[project]
name = "pizzeria-os-conciliacao"
version = "0.1.0"
description = "PIZZERIA OS — Módulo Conciliação e Cobrança (N1 expectativa · N2 repasse · N3 banco)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
