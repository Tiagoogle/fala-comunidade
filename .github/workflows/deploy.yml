name: deploy
# Publica o backend no Fly.io (gru) a cada push em main, depois que o CI passa.
# Requer o secret FLY_API_TOKEN no repositório (fly tokens create deploy -a escuta-mais).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-fly
  cancel-in-progress: false
jobs:
  fly:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
