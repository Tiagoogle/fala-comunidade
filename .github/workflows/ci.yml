name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Migrações em dia com os modelos
        run: ESCUTA_DATABASE_URL=sqlite:///ci.db alembic upgrade head && ESCUTA_DATABASE_URL=sqlite:///ci.db alembic check
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t escuta-mais:ci .
